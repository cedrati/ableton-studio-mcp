[project]
name = "ableton-studio-mcp"
version = "2.0.0"
description = "Ableton Live integration through the Model Context Protocol — AI music production: compose, arrange, mix, master and analyse in Ableton Live"
readme = "README.md"
keywords = ["ableton", "ableton-live", "mcp", "mcp-server", "model-context-protocol", "claude", "ai-music",
            "music-production", "daw", "midi", "mixing", "mastering", "lufs", "music-theory", "techno"]
requires-python = ">=3.10"
authors = [{name = "Olivier Cedrati"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Artistic Software",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "numpy>=1.26",
]

[project.scripts]
ableton-studio-mcp = "ableton_studio_mcp.server:main"
ableton-studio-mcp-install-script = "ableton_studio_mcp.install:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ableton_studio_mcp", "ableton_studio_mcp.tools"]

[tool.setuptools.package-data]
# The Live control surface is copied into Live by `ableton-studio-mcp install`.
ableton_studio_mcp = ["live_script/AbletonStudioMCP/*.py"]

[project.urls]
"Homepage" = "https://github.com/cedrati/ableton-studio-mcp"
"Bug Tracker" = "https://github.com/cedrati/ableton-studio-mcp/issues"
"Changelog" = "https://github.com/cedrati/ableton-studio-mcp/blob/main/CHANGELOG.md"
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (real bugs: undefined names, unused imports...) and pycodestyle errors.
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
"ableton_studio_mcp/tools/__init__.py" = ["F401", "F403"]   # re-exports every tool
"ableton_studio_mcp/live_script/**" = ["E402"]               # version set before imports
"tests/**" = ["F811"]                                         # pytest fixtures imported from other test modules
