[project]
name = "ableton-studio-mcp"
version = "1.17.0"
description = "Ableton Live integration through the Model Context Protocol — AI music production: compose, arrange, mix, master and analyse in Ableton Live"
readme = "README.md"
keywords = ["ableton", "ableton-live", "mcp", "mcp-server", "model-context-protocol", "claude", "ai-music",
            "music-production", "daw", "midi", "mixing", "mastering", "lufs", "music-theory", "techno"]
requires-python = ">=3.10"
authors = [
    {name = "Olivier Cedrati"},
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Artistic Software",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "supabase>=2.0.0",
    "numpy>=1.26",
]

[project.scripts]
ableton-studio-mcp = "MCP_Server.server:main"
ableton-studio-mcp-install-script = "MCP_Server.remote_script_install:main"
# Former names, kept so existing configurations keep working
ableton-mcp = "MCP_Server.server:main"
ableton-mcp-install-script = "MCP_Server.remote_script_install:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MCP_Server", "MCP_Server.dataset", "MCP_Server.bundled_ableton_remote_script"]
# MANIFEST.in governs the sdist; this governs the wheel. Both are needed.
exclude-package-data = { "MCP_Server" = ["config.py"] }

[tool.setuptools.package-data]
"MCP_Server.bundled_ableton_remote_script" = ["AbletonMCP_init.py"]

[project.urls]
"Homepage" = "https://github.com/cedrati/ableton-studio-mcp"
"Bug Tracker" = "https://github.com/cedrati/ableton-studio-mcp/issues"
"Upstream" = "https://github.com/ahujasid/ableton-mcp"