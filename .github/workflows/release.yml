name: release

# Push a tag vX.Y.Z (matching `version` in pyproject.toml) to test, build,
# publish to PyPI and create the GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # GitHub release
      id-token: write   # PyPI trusted publishing (no token stored)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - name: Tag matches the package and Remote Script versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          code=$(grep -m1 '^__version__' ableton_studio_mcp/__init__.py | cut -d'"' -f2)
          script=$(grep -m1 '^SCRIPT_VERSION' ableton_studio_mcp/live_script/AbletonStudioMCP/__init__.py | cut -d'"' -f2)
          registry=$(jq -r .version server.json)
          echo "tag=$tag package=$pkg code=$code server.json=$registry control-surface=$script"
          test "$tag" = "$pkg" && test "$tag" = "$code" && test "$tag" = "$registry"
          # the control surface must belong to the same series (major.minor)
          test "${script%.*}" = "${tag%.*}"
      - name: Tests
        run: uv run --with pytest pytest -q
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" dist/* --clobber \
            || gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."

      # ── Official MCP Registry (registry.modelcontextprotocol.io) ──────────
      # It checks the "mcp-name:" line in the README that PyPI shows, so wait
      # until PyPI serves the new version.
      - name: Wait for PyPI to serve the release
        run: |
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/ableton-studio-mcp/${GITHUB_REF_NAME#v}/json" >/dev/null && exit 0
            sleep 10
          done
          echo "PyPI never served ${GITHUB_REF_NAME#v}"; exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.11
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
