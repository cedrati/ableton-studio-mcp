name: release

# Push a tag vX.Y.Z (matching `version` in pyproject.toml) to test, build,
# publish to PyPI and create the GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # GitHub release
      id-token: write   # PyPI trusted publishing (no token stored)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - name: Tag matches the package and Remote Script versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          script=$(grep -m1 '^SCRIPT_VERSION' AbletonMCP_Remote_Script/__init__.py | cut -d'"' -f2)
          echo "tag=$tag package=$pkg script=$script"
          test "$tag" = "$pkg" && test "$tag" = "$script"
          cmp AbletonMCP_Remote_Script/__init__.py MCP_Server/bundled_ableton_remote_script/AbletonMCP_init.py
      - name: Tests
        run: uv run --with pytest pytest -q
      - name: Build
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" dist/* --clobber \
            || gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
