name: tests

on:
  push:
    branches: [main, feat/mixer-scenes]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint (undefined names, unused imports, syntax)
        run: uvx ruff check ableton_studio_mcp tests
      - name: Tests
        run: uv run --with pytest pytest -q
      - name: The built package installs and registers every tool
        run: |
          uv build
          uv venv "$RUNNER_TEMP/pkg"
          uv pip install --python "$RUNNER_TEMP/pkg/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          pkg/bin/ableton-studio-mcp --version
          pkg/bin/python -c "import asyncio, ableton_studio_mcp.tools; from ableton_studio_mcp.app import mcp; n = len(asyncio.run(mcp.list_tools())); print(n, 'tools'); assert n >= 96"
          test -f pkg/lib/python*/site-packages/ableton_studio_mcp/live_script/AbletonStudioMCP/__init__.py

  docker:
    # What directories such as Glama check: the image builds, starts without
    # Live and answers MCP introspection.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t ableton-studio-mcp .
      - name: The container answers tools/list without Live
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 60 docker run -i --rm ableton-studio-mcp > out.jsonl
          python3 -c "import json; r=[json.loads(l) for l in open('out.jsonl') if l.strip()]; n=len(next(x for x in r if x.get('id')==2)['result']['tools']); print(n, 'tools'); assert n >= 96"
